backend:
  name: github
  repo: armado719/Huellas-_Del_Saber_WEB-
  branch: main
  base_url: https://huellasdelsaber.edu.co
  auth_endpoint: api/begin

local_backend: true

media_folder: "public/img"
public_folder: "/img"

site_url: https://huellasdelsaber.edu.co
display_url: https://huellasdelsaber.edu.co

collections:
  - name: niveles
    label: Niveles educativos
    files:
      - name: niveles
        label: Niveles educativos
        file: content/niveles.json
        fields:
          - label: Niveles
            name: items
            widget: list
            fields:
              - { label: Edad, name: edad, widget: string }
              - { label: Nivel, name: nivel, widget: string }
              - { label: Imagen, name: img, widget: image }
              - { label: Alt, name: alt, widget: string }
              - { label: Frase, name: frase, widget: string }
              - { label: Bullets, name: bullets, widget: list }
              - { label: Que trabajamos, name: queTrabajamos, widget: list }
              - { label: Descripción, name: descripcion, widget: text }

  - name: faq
    label: FAQ
    files:
      - name: faq
        label: FAQ
        file: content/faq.json
        fields:
          - label: Preguntas
            name: items
            widget: list
            fields:
              - { label: Id, name: id, widget: string }
              - { label: Pregunta, name: pregunta, widget: string }
              - { label: Respuesta, name: respuesta, widget: text }
              - { label: Categoria, name: categoria, widget: string }

  - name: cards
    label: Tarjetas institucionales
    files:
      - name: cards
        label: Tarjetas institucionales
        file: content/cards.json
        fields:
          - label: Tarjetas
            name: items
            widget: list
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: desc, widget: string }
              - { label: Icono, name: icon, widget: string }
              - { label: Imagen, name: img, widget: image }
              - { label: Alt, name: alt, widget: string }

  - name: pilares
    label: Pilares de la propuesta
    files:
      - name: pilares
        label: Pilares de la propuesta
        file: content/pilares.json
        fields:
          - label: Pilares
            name: items
            widget: list
            fields:
              - { label: Número, name: num, widget: string }
              - { label: Icono, name: icon, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Descripción, name: desc, widget: text }
              - { label: Imagen, name: img, widget: image }
              - { label: Alt, name: alt, widget: string }

  - name: galeria
    label: Galería
    files:
      - name: galeria
        label: Galería
        file: content/galeria.json
        fields:
          - { label: Imágenes, name: items, widget: list }

  - name: pasos
    label: Proceso de admisión
    files:
      - name: pasos
        label: Proceso de admisión
        file: content/pasos.json
        fields:
          - label: Pasos
            name: items
            widget: list
            fields:
              - { label: Número, name: num, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Descripción, name: desc, widget: text }
              - { label: Icono, name: icon, widget: string }
